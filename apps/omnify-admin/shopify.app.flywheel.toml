# Flywheel — scaffold only (no routes wired yet)
# Register a new app in Shopify Partner Dashboard and paste the client_id here,
# then `shopify app deploy --config shopify.app.flywheel.toml` to register
# scopes + webhooks on Shopify's side.

client_id = "224a759a47ba16823a3cbfbe59c8af14"
name = "Flywheel"
application_url = "https://flywheel.cpg-labs.io"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Minimal placeholder. Expand when feature scope is defined.
scopes = "read_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://flywheel.cpg-labs.io/api/auth" ]
