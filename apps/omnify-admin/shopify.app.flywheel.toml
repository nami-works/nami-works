# Flywheel — scaffold only (no routes wired yet)
# Register a new app in Shopify Partner Dashboard and paste the client_id here,
# then `shopify app deploy --config shopify.app.flywheel.toml` to register
# scopes + webhooks on Shopify's side.

client_id = "224a759a47ba16823a3cbfbe59c8af14"
name = "Flywheel"
application_url = "https://flywheel.cpg-labs.io"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Scopes the Affiliates surface actually exercises:
#   read_customers  — app.affiliates.tsx (profile detail, claims)
#   read_discounts  — affiliates/programs.server.ts (codeDiscountNodes sync)
#   read_orders     — affiliates/sync.server.ts (attribution + monthly rebuild)
#   read_products   — currently unused by Affiliates but kept as a baseline
#                     read scope so the embedded app shell can render
# Protected Customer Data scopes (read_customers, read_orders) are granted at
# install time on a custom-distributed app without going through Shopify's
# PCD review.
scopes = "read_customers,read_discounts,read_orders,read_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://flywheel.cpg-labs.io/api/auth" ]
