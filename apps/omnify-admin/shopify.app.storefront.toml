# Storefront — UI automations for conversion improvement app
# Register a new app in Shopify Partner Dashboard and paste the client_id here.

client_id = "49494c413ff1ffea31405ec6a269028b"
name = "Storefront"
application_url = "https://storefront.cpg-labs.io"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
scopes = "read_products,write_products,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_themes,read_discounts"
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://storefront.cpg-labs.io/api/auth" ]
