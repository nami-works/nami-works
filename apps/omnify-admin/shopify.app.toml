# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "58ada92edbe153c956b3600e58e17382"
name = "Omnify"
# Hosted at app.cpg-labs.io (Phase 6 cutover 2026-04-29). Was previously at
# omnify.cpg-labs.io/full with BASE_PATH=/full baked into the build, which
# caused intermittent /full/full/* double-prefix bugs (App Bridge prepends
# application_url's path component to <s-link> hrefs at navigation time).
# Moving to a dedicated hostname kills BASE_PATH entirely and structurally
# eliminates that whole bug class.
application_url = "https://app.cpg-labs.io"
embedded = true

[build]
automatically_update_urls_on_dev = true

# Webhooks — compliance, customers/*, and orders/* require Protected Customer Data
# approval (granted). Redeploy via `shopify app deploy --config shopify.app.toml`
# after any change here to re-register the subscriptions on Shopify's side.
[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "customers/create", "customers/update", "customers/delete" ]
  uri = "/webhooks/customers"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated", "orders/delete" ]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_locations,read_merchant_managed_fulfillment_orders,read_orders,read_all_orders,read_products,write_products,read_publications,read_shipping,write_shipping,write_orders,write_merchant_managed_fulfillment_orders,read_content,write_content,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_themes,read_discounts,read_fulfillments,write_fulfillments"
use_legacy_install_flow = false

[auth]
# /auth (not /api/auth) matches authPathPrefix in app/shopify.server.ts.
# Aligns with the Omnify focused app's toml — fresh-install OAuth flow goes
# through cleanly. The previous /full/api/auth path mismatched and would
# have failed any reviewer-triggered fresh install.
redirect_urls = [ "https://app.cpg-labs.io/auth" ]
