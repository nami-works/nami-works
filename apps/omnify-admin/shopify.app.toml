# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "58ada92edbe153c956b3600e58e17382"
name = "CPG Labs"
# Hosted at /full on the main domain (same ALB as main app)
application_url = "https://omnify.cpg-labs.io/full"
embedded = true

[build]
automatically_update_urls_on_dev = true

# Webhooks for compliance, customers/*, and orders/* require Protected Customer Data approval.
# Partner Dashboard → CPG Labs → API access requests → Protected customer data access.
# After approval, add back: compliance, customers, orders subscriptions and redeploy.
[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_locations,read_merchant_managed_fulfillment_orders,read_orders,read_all_orders,read_products,write_products,read_publications,read_shipping,write_shipping,write_orders,write_merchant_managed_fulfillment_orders,read_content,write_content,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_themes,read_discounts"
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://omnify.cpg-labs.io/full/api/auth" ]
