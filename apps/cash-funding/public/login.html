<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Antecipação de Recebíveis — GE Beauty</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Antecipação de Recebíveis</h1>
    <p class="muted">GE Cosméticos LTDA — cash &amp; funding</p>
    <p id="err" class="error" hidden></p>
    <a class="btn btn-primary" href="/auth/google/start">Entrar com Google</a>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get("error");
    if (err) {
      const messages = {
        google: "Não foi possível validar com o Google. Tente novamente.",
        verify: "Não foi possível verificar sua conta Google.",
        expired: "Sessão de login expirou. Tente novamente.",
        not_invited: "Essa conta ainda não tem acesso. Peça um convite.",
        account_mismatch: "Este e-mail já está vinculado a outra conta Google.",
      };
      const el = document.getElementById("err");
      el.textContent = messages[err] ?? "Erro ao entrar. Tente novamente.";
      el.hidden = false;
    }
  </script>
</body>
</html>
