<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linha do tempo — mockup</title>
<style>
  :root {
    --bg: #f4f4f2; --card: #fff; --border: #dad8d1; --text: #1a1a18; --muted: #5a5a57;
    --green-bg: #d9ecdb; --green-text: #205c33;
    --yellow-bg: #fbe7bf; --yellow-text: #7a5300;
    --grey-bg: #e7e6e2; --grey-text: #7a7975;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
  header { padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  header .muted { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px 60px; }
  .toolbar { margin-bottom: 14px; display: flex; gap: 10px; align-items: end; }
  .toolbar label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
  input[type="date"] { font-family: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  table { border-collapse: collapse; min-width: 100%; font-size: 12.5px; }
  th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); min-width: 260px; z-index: 1; }
  thead th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 2px solid var(--border); }
  tr.client-header td { background: #eceae3; font-weight: 700; font-size: 12.5px; padding-top: 9px; padding-bottom: 9px; }
  tr.client-header td:first-child { background: #eceae3; }
  tr.po-row td:first-child { padding-left: 22px; color: var(--muted); }
  tr.client-total td { font-weight: 700; border-top: 1px solid var(--border); border-bottom: 2px solid var(--border); }
  tr.client-total td:first-child { padding-left: 22px; }
  tr.grand-row td { font-weight: 700; }
  tr.grand-row td:first-child { background: var(--card); }
  .cell-green { background: var(--green-bg); color: var(--green-text); }
  .cell-yellow { background: var(--yellow-bg); color: var(--yellow-text); }
  .cell-grey { background: var(--grey-bg); color: var(--grey-text); }
  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
  <header>
    <h1>Linha do tempo de recebíveis — mockup</h1>
    <span class="muted">alimentado por dados reais via /api/timeline</span>
  </header>
  <main>
    <div class="toolbar">
      <label>Data de referência
        <input type="date" id="ref-date" />
      </label>
    </div>
    <div class="table-wrap">
      <table id="timeline-table"></table>
    </div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--green-bg)"></span>pode ser antecipado agora, dentro do prazo e do limite de algum financiador</span>
      <span><span class="swatch" style="background:var(--yellow-bg)"></span>está no prazo de algum financiador, mas o limite dele já está esgotado</span>
      <span><span class="swatch" style="background:var(--grey-bg)"></span>fora do prazo de todos os financiadores</span>
    </div>
  </main>
  <script>
    const fmtBRL = (n) => Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const fmtMonth = (m) => {
      const [y, mo] = m.split("-");
      const names = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
      return `${names[Number(mo) - 1]}/${y.slice(2)}`;
    };
    const cellClass = (v) => (v === "green" ? "cell-green" : v === "yellow" ? "cell-yellow" : "cell-grey");

    async function load(date) {
      const url = date ? `/api/timeline?date=${date}` : "/api/timeline";
      const res = await fetch(url);
      if (res.status === 401) { location.href = "/login.html"; return; }
      const data = await res.json();
      render(data);
    }

    function render(data) {
      const { months, clients, grandTotals } = data;
      const table = document.getElementById("timeline-table");

      let head = `<thead><tr><th>Cliente / PO</th>${months.map((m) => `<th>${fmtMonth(m)}</th>`).join("")}<th>Total</th></tr></thead>`;

      let body = "<tbody>";
      for (const client of clients) {
        body += `<tr class="client-header"><td colspan="${months.length + 2}">${client.cliente}</td></tr>`;
        for (const po of client.pos) {
          body += `<tr class="po-row"><td>${po.produto}</td>`;
          for (const m of months) {
            const cell = po.cells[m];
            body += cell ? `<td class="${cellClass(cell.verdict)}">${fmtBRL(cell.value)}</td>` : `<td></td>`;
          }
          body += `<td>${fmtBRL(po.total)}</td></tr>`;
        }
        body += `<tr class="client-total"><td>TOTAL ${client.cliente}</td>`;
        for (const m of months) {
          const cell = client.totals[m];
          body += cell ? `<td class="${cellClass(cell.verdict)}">${fmtBRL(cell.value)}</td>` : `<td></td>`;
        }
        body += `<td>${fmtBRL(client.total)}</td></tr>`;
      }
      body += "</tbody>";

      const grandSpan = months.length + 1;
      let foot = `<tfoot>
        <tr class="grand-row"><td>Total verde (antes de tarifas)</td><td colspan="${grandSpan}" class="cell-green">${fmtBRL(grandTotals.greenBeforeFees)}</td></tr>
        <tr class="grand-row"><td>Total verde (após tarifas, alocação mais inteligente)</td><td colspan="${grandSpan}" class="cell-green">${fmtBRL(grandTotals.greenAfterFees)}</td></tr>
        <tr class="grand-row"><td>Total amarelo (antes de tarifas)</td><td colspan="${grandSpan}" class="cell-yellow">${fmtBRL(grandTotals.yellowBeforeFees)}</td></tr>
        <tr class="grand-row"><td>Total cinza (antes de tarifas)</td><td colspan="${grandSpan}" class="cell-grey">${fmtBRL(grandTotals.greyBeforeFees)}</td></tr>
      </tfoot>`;

      table.innerHTML = head + body + foot;
    }

    document.getElementById("ref-date").addEventListener("change", (e) => load(e.target.value));
    document.getElementById("ref-date").valueAsDate = new Date();
    load(new Date().toISOString().slice(0, 10));
  </script>
</body>
</html>
